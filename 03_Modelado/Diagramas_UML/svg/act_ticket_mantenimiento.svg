"644.1021"/><polygon fill="#A80036" points="359.5,640.1021,349.5,644.1021,359.5,648.1021,355.5,644.1021" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="337.5" x2="337.5" y1="158.8906" y2="178.8906"/><polygon fill="#A80036" points="333.5,168.8906,337.5,178.8906,341.5,168.8906,337.5,172.8906" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="337.5" x2="337.5" y1="656.1021" y2="676.1021"/><polygon fill="#A80036" points="333.5,666.1021,337.5,676.1021,341.5,666.1021,337.5,670.1021" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[039732873df9da56a78016d24cb404c3]
@startuml act_ticket_mantenimiento
title Flujo de actividad · Ticket de mantenimiento (CU-06 → CU-07)

start
:Usuario registra solicitud de mantenimiento;
:Sistema valida los campos obligatorios;

if (¿Campos completos?) then (sí)
    :Sistema genera ticket con ID único;
    :Sistema registra la solicitud en bitácora;

    repeat
        :Personal de Infraestructura revisa el ticket;
        :Personal de Infraestructura actualiza el estado;
        :Sistema registra el cambio en bitácora;
    repeat while (¿Ticket sigue abierto?) is (sí)
    ->no;

    :Sistema marca el ticket como cerrado;
else (no)
    :Sistema solicita completar la información;
endif

stop

@enduml

